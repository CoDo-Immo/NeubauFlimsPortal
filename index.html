<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Neubau Flims</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#23423a">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Neubau Flims">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
/* Materialpalette: Kalkputz, Sichtbeton, Lärche, Flimserwald, Caumasee */
:root{
  --kalk:#ecebe6; --beton:#f8f8f5; --fuge:#d6d4cc; --graphit:#24282b; --stein:#6c7068;
  --wald:#23423a; --wald-2:#2f5a4e; --wald-soft:#dfe8e3;
  --laerche:#a8692c; --laerche-soft:#f3e6d6;
  --see:#1f8a87; --see-soft:#d9eeec;
  --rost:#a3402d;
  --head-ink:#f2f1ec; --head-muted:#b9c8c1; --contour:rgba(255,255,255,.09);
  --sans:"Archivo","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --kalk:#16191a; --beton:#1d2123; --fuge:#30363a; --graphit:#e8e8e3; --stein:#9ba29a;
  --wald:#11241f; --wald-2:#8ec4b2; --wald-soft:#1f322c;
  --laerche:#e0a466; --laerche-soft:#3a2b1c; --see:#6fd0cb; --see-soft:#16302f; --rost:#f08b74;
  --head-ink:#eef0ea; --head-muted:#9fb3ab; --contour:rgba(255,255,255,.06);}}
:root[data-theme="dark"]{
  --kalk:#16191a; --beton:#1d2123; --fuge:#30363a; --graphit:#e8e8e3; --stein:#9ba29a;
  --wald:#11241f; --wald-2:#8ec4b2; --wald-soft:#1f322c;
  --laerche:#e0a466; --laerche-soft:#3a2b1c; --see:#6fd0cb; --see-soft:#16302f; --rost:#f08b74;
  --head-ink:#eef0ea; --head-muted:#9fb3ab; --contour:rgba(255,255,255,.06);}
*{box-sizing:border-box}
html{background:var(--kalk)}
body{margin:0;background:var(--kalk);color:var(--graphit);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--see);outline-offset:2px;border-radius:4px}

/* ---------- Kopf mit Höhenkurven ---------- */
header{position:relative;background:var(--wald);color:var(--head-ink);overflow:hidden}
#contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.head{position:relative;max-width:1440px;margin:0 auto;padding:28px 32px 0}
.toprow{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}
.owner{font-size:13px;color:var(--head-muted);letter-spacing:.01em}
h1{margin:4px 0 2px;font-size:clamp(30px,5.4vw,60px);overflow-wrap:anywhere;line-height:1;font-weight:760;font-stretch:125%;letter-spacing:-.02em}
.addr{font-size:15px;color:var(--head-muted);font-stretch:100%}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.search{position:relative}
.search input{width:300px;max-width:78vw;padding:10px 12px 10px 36px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:var(--head-ink)}
.search input::placeholder{color:var(--head-muted)}
.search input:focus{background:rgba(255,255,255,.14);outline:none;border-color:var(--see)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--head-muted)}
.hbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--head-ink);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:550}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn.menu{display:none}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:22px 0 0;font-size:13.5px;color:var(--head-muted)}
.facts b{display:block;color:var(--head-ink);font-size:17px;font-weight:650;font-stretch:112%}

/* ---------- Bauzeitleiste ---------- */
.timeline{position:relative;margin:26px 0 0;padding:0 0 22px;display:flex;align-items:stretch;gap:0;overflow-x:auto}
.tl-proj{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;padding-right:22px;margin-right:22px;border-right:1px solid rgba(255,255,255,.18)}
.tl-phase{flex:1 1 0;min-width:120px;cursor:pointer;padding-right:6px}
.tl-phase:hover .tl-name{color:var(--head-ink)}
.tl-name{font-size:13px;color:var(--head-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:9px;font-weight:500}
.tl-name b{color:var(--head-ink);font-weight:700;margin-right:5px;font-stretch:115%}
.tl-phase.aktuell .tl-name{color:var(--head-ink)}
.tl-bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.tl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--head-muted);width:0}
.tl-phase.aktuell .tl-fill{background:var(--see)}
.tl-phase.abgeschlossen .tl-fill{width:100%}
.tl-subs{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tl-sub{font-size:11.5px;padding:2px 7px;border-radius:999px;color:var(--head-muted);border:1px solid transparent;cursor:pointer;white-space:nowrap}
.tl-sub:hover{border-color:rgba(255,255,255,.25)}
.tl-sub.now{background:var(--see);color:#fff;font-weight:650}
.tl-sub.sel,.tl-phase.sel>.tl-name{text-decoration:underline;text-underline-offset:3px}
.tl-projbtn{background:none;border:1px solid rgba(255,255,255,.28);color:var(--head-ink);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;line-height:1.25}
.tl-projbtn small{display:block;color:var(--head-muted);font-size:11.5px}
.tl-projbtn.sel{background:rgba(255,255,255,.12);border-color:var(--head-ink)}
@media (prefers-reduced-motion:no-preference){ .tl-fill{transition:width 1.1s cubic-bezier(.2,.7,.2,1) .15s} }

/* ---------- Rumpf ---------- */
.wrap{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:0}
nav{padding:22px 14px 60px 24px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.tree ul{list-style:none;margin:0;padding-left:15px;border-left:1px solid var(--fuge);margin-left:9px}
.tree>ul{padding-left:0;border:0;margin-left:0}
.node{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;user-select:none;font-size:14px}
.node:hover{background:var(--beton)}
.node.sel{background:var(--wald-2);color:var(--beton)}
.node.sel .cnt,.node.sel .tw{color:var(--beton);opacity:.75}
.node .tw{width:12px;text-align:center;color:var(--stein);font-size:10px;flex:0 0 auto}
.node .cnt{margin-left:auto;color:var(--stein);font-size:12px}
.node.arch{color:var(--stein);font-style:italic}
.node.empty{color:var(--stein)}
.navgap{height:14px}
main{padding:28px 36px 80px;min-width:0;background:var(--beton);border-left:1px solid var(--fuge);min-height:70vh}
.crumb{color:var(--stein);font-size:13px;margin-bottom:10px}
.crumb span{cursor:pointer}
.crumb span:hover{color:var(--graphit);text-decoration:underline}
h2{margin:0;font-size:28px;line-height:1.15;font-weight:720;font-stretch:118%;letter-spacing:-.015em}
.lead{color:var(--stein);margin:6px 0 26px;max-width:70ch}
h3{font-size:16px;font-weight:700;margin:34px 0 10px;display:flex;align-items:baseline;gap:10px}
h3 small{font-weight:450;color:var(--stein);font-size:13px}
.readme{display:inline-block;color:var(--stein);font-size:13px;margin:-14px 0 20px}
.readme a{color:var(--see)}

/* Dokumentliste */
.docs{border-top:2px solid var(--graphit)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 190px;gap:16px;padding:13px 4px;border-bottom:1px solid var(--fuge);align-items:start}
.row.plain{grid-template-columns:minmax(0,1fr) 110px 90px}
.row.head{font-size:12.5px;color:var(--stein);padding:8px 4px;font-weight:500}
.row:not(.head):hover{background:var(--kalk)}
.doc-title{font-weight:650;margin-bottom:5px}
.file{display:flex;gap:10px;align-items:flex-start;min-width:0;margin-top:3px}
.file a{text-decoration:none;word-break:break-word;color:var(--graphit)}
.file a:hover{color:var(--see);text-decoration:underline;text-underline-offset:2px}
.ico{flex:0 0 32px;height:20px;display:grid;place-items:center;border-radius:3px;font-size:9.5px;font-weight:750;letter-spacing:.03em;color:#fff;margin-top:1px;font-stretch:90%}
.t-pdf{background:#a3402d}.t-docx,.t-doc{background:#355d8a}.t-xlsx,.t-xls{background:#2f6f4c}.t-pptx{background:#b8622f}
.t-md{background:#6c7068}.t-mp4,.t-mov{background:#6a5590}.t-png,.t-jpg,.t-jpeg{background:#1f8a87}.t-other{background:#8a8d88}
.ver{font-size:12px;font-weight:700;color:var(--wald-2);margin-left:7px;white-space:nowrap}
.edit{display:inline-block;margin-left:9px;font-size:12px;font-weight:650;color:var(--see);text-decoration:none;border:1px solid var(--see);border-radius:999px;padding:0 8px;line-height:18px;white-space:nowrap}
.edit:hover{background:var(--see);color:var(--beton)}
.del{display:inline-block;margin-left:6px;font:inherit;font-size:12px;font-weight:600;color:var(--rost);background:none;border:1px solid transparent;border-radius:999px;padding:0 8px;line-height:18px;cursor:pointer;opacity:.55}
.row:hover .del{opacity:1;border-color:var(--rost)}
.del:hover,.del:focus-visible{background:var(--rost);color:var(--beton);opacity:1}
dialog.confirm{border:1px solid var(--fuge);border-radius:10px;padding:22px 24px;max-width:460px;background:var(--beton);color:var(--graphit);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog.confirm::backdrop{background:rgba(20,30,27,.45)}
dialog.confirm h4{margin:0 0 8px;font-size:18px;font-stretch:112%}
dialog.confirm p{margin:0 0 6px;color:var(--stein);font-size:14px;word-break:break-word}
dialog.confirm .fn{color:var(--graphit);font-weight:650}
dialog.confirm .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
dialog.confirm button{font:inherit;border-radius:999px;padding:8px 16px;cursor:pointer;border:1px solid var(--fuge);background:var(--kalk);color:var(--graphit)}
dialog.confirm button.danger{background:var(--rost);border-color:var(--rost);color:#fff;font-weight:650}
.newb{font-size:11px;font-weight:700;color:var(--rost);margin-left:7px}
.path{display:block;color:var(--stein);font-size:12.5px;margin-top:2px;cursor:pointer}
.path:hover{text-decoration:underline}
.date,.size{color:var(--stein);font-size:13.5px;white-space:nowrap;padding-top:1px}
.badge{display:inline-flex;align-items:baseline;gap:6px;font-size:13px;font-weight:600}
.badge::before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--stein);transform:translateY(-1px)}
.b-aktuell{color:var(--wald-2)}.b-aktuell::before{background:var(--wald-2)}
.b-entwurf{color:var(--laerche)}.b-entwurf::before{background:var(--laerche)}
.b-eingang{color:var(--see)}.b-eingang::before{background:var(--see)}
.note{display:block;color:var(--stein);font-size:12.5px;margin-top:3px;white-space:normal;line-height:1.4}
.warn{color:var(--rost);font-size:13px}

/* Unterordner als Register */
.registers{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.reg{display:flex;align-items:center;gap:10px;padding:9px 14px;border:1px solid var(--fuge);border-left:4px solid var(--wald-2);border-radius:4px 8px 8px 4px;background:var(--kalk);cursor:pointer;font-weight:600}
.reg:hover{border-color:var(--wald-2)}
.reg span{font-weight:450;color:var(--stein);font-size:13px}
.reg.arch{border-left-color:var(--stein);font-style:italic;font-weight:500}
.empty-state{color:var(--stein);padding:26px 4px;border-top:2px solid var(--graphit)}
.foot{margin-top:40px;color:var(--stein);font-size:12.5px}
.hver{position:absolute;top:8px;right:32px;font-size:11px;color:var(--head-muted);opacity:.85;letter-spacing:.01em}
@media (max-width:900px){.hver{right:16px;top:6px}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--graphit);color:var(--kalk);padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:9}
.toast.on{opacity:1}

/* Quelle */
.src{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--head-muted);padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:550}
.seg button.on{background:var(--head-ink);color:var(--wald)}
.hlink{color:var(--head-muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.hlink:hover{color:var(--head-ink)}
.who{font-size:12.5px;color:var(--head-muted)}
.who button{background:none;border:0;color:var(--head-muted);text-decoration:underline;cursor:pointer;padding:0 0 0 6px;font-size:12.5px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:880px;margin-top:8px}
.choice{border:1px solid var(--fuge);border-top:4px solid var(--wald-2);border-radius:6px;padding:18px 20px;background:var(--kalk)}
.choice h4{margin:0 0 6px;font-size:17px;font-weight:700;font-stretch:112%}
.choice p{margin:0 0 14px;color:var(--stein);font-size:14px}
.choice.local{border-top-color:var(--see)}
.mbtn{border:0;background:var(--wald-2);color:var(--beton);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:650}
.choice.local .mbtn{background:var(--see)}
.mbtn:disabled{opacity:.45;cursor:not-allowed}
.setup{margin-top:24px;max-width:880px;border-left:4px solid var(--laerche);background:var(--laerche-soft);padding:12px 16px;border-radius:0 6px 6px 0;font-size:14px}
.busy{color:var(--stein);padding:30px 0}
@media (max-width:900px){
  .head{padding:20px 16px 0}
  .wrap{grid-template-columns:1fr}
  nav{display:none;position:static;max-height:none;padding:14px 16px;border-bottom:1px solid var(--fuge)}
  nav.open{display:block}
  .hbtn.menu{display:inline-block}
  main{padding:20px 16px 60px;border-left:0}
  .search{flex:1 1 100%}.search input{width:100%;max-width:none}
  .row,.row.plain{grid-template-columns:minmax(0,1fr);gap:6px}
  .row .date,.row .size,.row.head .hd,.row.head>div:last-child{display:none}
  .row.head{grid-template-columns:1fr}
  .file a{word-break:break-all}
  .facts{gap:18px}
  .tl-phase{min-width:160px}
  .tl-proj{padding-right:14px;margin-right:14px}
}
</style>
</head>
<body>
<header>
  <svg id="contours" aria-hidden="true" preserveAspectRatio="none"></svg>
  <div class="head">
    <div class="hver" id="hver"></div>
    <div class="toprow">
      <div>
        <div class="owner">CoDo Immobilien AG</div>
        <h1>Portal Neubau Flims</h1>
        <div class="addr">Casa Coray, Prau Curtgin 5, Flims</div>
      </div>
      <div class="tools">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Dokumente durchsuchen" autocomplete="off" aria-label="Dokumente durchsuchen">
        </div>
        <button class="hbtn menu" id="menu">Ordner</button>
        <div class="src" id="srcbox"></div>
      </div>
    </div>
    <div class="facts" id="facts"></div>
    <div class="timeline" id="timeline"></div>
  </div>
</header>
<div class="wrap">
  <nav id="nav" aria-label="Ablage"><div class="tree" id="tree"></div></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog class="confirm" id="delDlg"><h4>Datei löschen?</h4><p class="fn" id="delName"></p><p>Die Datei wird in OneDrive gelöscht und liegt danach im Papierkorb von OneDrive, wo sie sich wiederherstellen lässt. Der Eintrag in KONTEXT.md bleibt bestehen und muss nachgeführt werden.</p><div class="btns"><button id="delNo" type="button">Abbrechen</button><button id="delYes" type="button" class="danger">Löschen</button></div></dialog>
<script>
const PORTAL_VERSION = "1.2";
const PORTAL_DATUM = "04.11.2026";
const SNAP = null;
const MODE = "web";   // "file" = lokale Datei im Projektordner, "web" = gehostete Seite
const CFG = {"clientId": "fda05041-c0b9-4a93-af9c-e266ebabf93e", "shareUrl": "https://1drv.ms/f/c/f41bc9247ecf3149/IgDW8fdLrfPVQLD3jdWSnXLhAWM9yLuGRhJfVN1Ixe5YN78", "davBase": "https://d.docs.live.net/f41bc9247ecf3149/Documente/LLM_Projekte/projekte/CoDO%20Neubau%20Flims/"};
const MSAL_URL = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js";
const SCOPES = ["Files.Read.All","User.Read"];
const WRITE_SCOPES = ["Files.ReadWrite.All"];
let OD_DRIVE = null, IS_OWNER = false;
let SOURCE = MODE==="file" ? "snapshot" : "none";   // snapshot | local | onedrive | none
const HANDLES = new Map();
let D = SNAP || {erstellt:"–",files:[],kern:[],phasen:{},stand:"",termine:{}};

let current = "";
const LABEL = {
  "0_Projekt":"Projekt (übergeordnet)","01_Vertraege":"Verträge","02_Offerten_Beschaffung":"Offerten & Beschaffung",
  "03_Projektorganisation":"Projektorganisation","04_Projektbeschreibung":"Projektbeschreibung","05_Vorlagen_Standards":"Vorlagen & Standards",
  "06_Medien":"Medien","Phasen":"SIA-Phasen","1_Strategische_Planung":"Strategische Planung","2_Vorstudien":"Vorstudien",
  "21_Definition_Machbarkeitsstudie":"21 Machbarkeitsstudie","22_Auswahlverfahren":"22 Auswahlverfahren","3_Projektierung":"Projektierung",
  "31_Vorprojekt":"31 Vorprojekt","32_Bauprojekt":"32 Bauprojekt","33_Bewilligungsverfahren":"33 Bewilligung","4_Ausschreibung":"Ausschreibung",
  "41_Ausschreibung_Vergabe":"41 Ausschreibung & Vergabe","5_Realisierung":"Realisierung","51_Ausfuehrungsprojekt":"51 Ausführungsprojekt",
  "52_Ausfuehrung":"52 Ausführung","53_Inbetriebnahme_Abschluss":"53 Inbetriebnahme","6_Bewirtschaftung":"Bewirtschaftung",
  "61_Betrieb":"61 Betrieb","62_Erhaltung_Monitoring":"62 Erhaltung","_Archiv":"Archiv","Grundlagen":"Eingang","outputs":"Versand"
};
const ORDER = ["0_Projekt","Phasen","Grundlagen","outputs"];
const label = n => LABEL[n] || n.replace(/_/g," ");
const phaseLabel = n => { const m=n.match(/^(\d)_/); return m? m[1]+" "+label(n) : label(n); };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[_\-.]/g," ");
const href = p => p.split("/").map(encodeURIComponent).join("/");
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
const lastVisit = store("codo-portal-lastvisit");
window.addEventListener("beforeunload",()=>store("codo-portal-lastvisit",new Date().toISOString().slice(0,16)));

function fmtDate(m){ if(!m) return "–"; const [d]=m.split("T"); const [y,mo,da]=d.split("-"); return `${da}.${mo}.${y}`; }
function fmtSize(b){ if(b==null) return ""; if(b<1024) return b+" B"; const kb=b/1024; if(kb<1024) return Math.round(kb).toLocaleString("de-CH")+" KB";
  const mb=kb/1024; return (mb<10?mb.toFixed(1):Math.round(mb).toLocaleString("de-CH"))+" MB"; }
function ext(n){ const m=n.match(/\.([a-z0-9]+)$/i); return m?m[1].toLowerCase():""; }
function ver(n){ const m=n.match(/_v(\d+[a-z]?)(?=\.[a-z0-9]+$)/i); return m?"v"+m[1]:""; }
function statusClass(s){ const l=s.toLowerCase(); if(l.startsWith("aktuell")||l.startsWith("abgeschlossen")||l.startsWith("neufassung")) return "b-aktuell";
  if(l.startsWith("entwurf")) return "b-entwurf"; if(l.startsWith("eingang")) return "b-eingang"; return ""; }

/* ---------- Höhenkurven ---------- */
function drawContours(){
  const svg=$("#contours"), W=1440, H=420; svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const ph=[rnd()*6,rnd()*6,rnd()*6]; let paths="";
  for(let i=0;i<17;i++){
    const base=-40+i*28; let d="";
    for(let x=0;x<=W;x+=24){
      const y=base+Math.sin(x/260+ph[0]+i*.11)*34+Math.sin(x/120+ph[1]-i*.07)*12+Math.sin(x/540+ph[2])*(40+i*3);
      d+=(x?"L":"M")+x+" "+y.toFixed(1)+" ";
    }
    paths+=`<path d="${d}" fill="none" stroke="var(--contour)" stroke-width="${i%5===0?1.6:1}"/>`;
  }
  svg.innerHTML=paths;
}

function buildTree(){
  const root={name:"",path:"",kids:{},files:[]};
  for(const f of D.files){
    const isDir=!!f.d; const parts=f.p.replace(/\/$/,"").split("/");
    let n=root; const upto=isDir?parts.length:parts.length-1;
    for(let i=0;i<upto;i++){ const nm=parts[i]; n.kids[nm]=n.kids[nm]||{name:nm,path:parts.slice(0,i+1).join("/"),kids:{},files:[]}; n=n.kids[nm]; }
    if(!isDir) n.files.push(f);
  }
  return root;
}
let TREE=buildTree();
const isReadme=f=>/00_README\.md$/.test(f.p);
function count(n){ return n.files.filter(f=>!isReadme(f)).length+Object.values(n.kids).reduce((a,k)=>a+count(k),0); }
function nodeAt(path){ if(!path) return TREE; let n=TREE; for(const p of path.split("/")){ n=n.kids[p]; if(!n) return null;} return n; }
function sortKids(n){ return Object.values(n.kids).sort((a,b)=>{ const ia=ORDER.indexOf(a.name), ib=ORDER.indexOf(b.name);
  if(n===TREE && (ia>-1||ib>-1)) return (ia<0?99:ia)-(ib<0?99:ib);
  if(a.name==="_Archiv") return 1; if(b.name==="_Archiv") return -1; return a.name.localeCompare(b.name,"de",{numeric:true}); }); }
let openSet; try{ openSet=new Set(JSON.parse(store("codo-portal-open")||"null")||["0_Projekt","Phasen","Phasen/3_Projektierung"]); }catch(e){ openSet=new Set(["0_Projekt","Phasen","Phasen/3_Projektierung"]); }
function expandTo(p){ p.split("/").reduce((a,s)=>{ const x=a?a+"/"+s:s; openSet.add(x); return x; },""); }
function nodeLabel(n){ return /^\d_/.test(n.name)? phaseLabel(n.name) : label(n.name); }
function renderTree(){
  const li=n=>{ const kids=sortKids(n); const has=kids.length>0; const c=count(n); const isOpen=openSet.has(n.path);
    const cls=["node"]; if(current===n.path) cls.push("sel"); if(n.name==="_Archiv") cls.push("arch"); if(!c) cls.push("empty");
    return `<li><div class="${cls.join(" ")}" data-path="${esc(n.path)}" tabindex="0"><span class="tw" data-tw="${esc(n.path)}">${has?(isOpen?"▾":"▸"):""}</span><span>${esc(nodeLabel(n))}</span><span class="cnt">${c||""}</span></div>${has&&isOpen?`<ul>${kids.map(li).join("")}</ul>`:""}</li>`; };
  $("#tree").innerHTML=`<ul><li><div class="node ${current===""?"sel":""}" data-path="" tabindex="0"><span class="tw"></span><span>Gültige Dokumente</span></div></li><li><div class="node ${current==="__root"?"sel":""}" data-path="__root" tabindex="0"><span class="tw"></span><span>Steuerdateien</span><span class="cnt">${TREE.files.length}</span></div></li></ul><div class="navgap"></div><ul>${sortKids(TREE).map(li).join("")}</ul>`;
}
function treeAct(e){

function crumb(path){

function resolveKern(k){
  const inFolder=D.files.filter(f=>!f.d && f.p.startsWith(k.ablage+"/") && !f.p.slice(k.ablage.length+1).includes("/"));
  const out=[];
  for(const t of k.tokens){ const hit=inFolder.find(f=>{const n=f.p.split("/").pop(); return n===t||n===t+k.ext||(n.includes(t) && (!k.ext||n.endsWith(k.ext)));}); if(hit && !out.includes(hit)) out.push(hit); }
  return out;
}

/* ---------- Ordner neu einlesen (File System Access API, Edge/Chrome) ---------- */
function parseKern(k){
  const m=k.match(/\n## Dokumente\n([\s\S]*?)(\n## |\n### |$)/); if(!m) return [];
  const rows=[];
  for(const line of m[1].split("\n")){
    if(!line.startsWith("| ")||line.startsWith("| Dokument |")||line.startsWith("|---")) continue;
    const c=line.trim().replace(/^\||\|$/g,"").split("|").map(s=>s.trim()); if(c.length<5) continue;
    let [doc,datei,ablage,stand,status]=c; ablage=ablage.replace(/`/g,"").replace(/\/$/,"");
    let e=""; const mm=datei.match(/\((\.\w+)\)\s*$/); if(mm){ e=mm[1]; datei=datei.slice(0,mm.index).trim(); }
    rows.push({doc,tokens:datei.split(", ").map(s=>s.trim()).filter(Boolean),ext:e,ablage,stand,status});
  }
  return rows;
}
function parseTermine(k){ const o={}; let m=k.match(/Baueingabe angestrebt:\s*\*\*([^*]+)\*\*/); if(m) o.Baueingabe=m[1].trim(); m=k.match(/Gewünschter Baubeginn:\s*\*\*([^*]+)\*\*/); if(m) o.Baubeginn=m[1].trim(); return o; }
function parsePhasen(s){
  const out={}; const re=/(\d_[A-Za-z_]+)\/\s.*?(✅|🟡|⬜)/g; let m;
  while((m=re.exec(s))) out[m[1]]={"✅":"abgeschlossen","🟡":"aktuell","⬜":"offen"}[m[2]];
  const a=s.match(/## Aktueller Stand\n(.+)/); return [out,a?a[1].replace(/[`*🟡✅⬜]/g,"").trim():""];
}

/* ---------- Lokaler Ordner (File System Access API, Edge/Chrome) ---------- */
async function walk(dir,prefix,out,keep){
  for await (const [name,h] of dir.entries()){
    if(h.kind==="directory"){ if(name==="_Portal"||name.startsWith("_to_delete")||name===".git") continue;
      out.push({p:prefix+name+"/",d:1}); await walk(h,prefix+name+"/",out,keep); }
    else { if(SKIP.has(name)||name.startsWith("~$")||name.startsWith(".~lock")) continue;
      const f=await h.getFile(); out.push({p:prefix+name,s:f.size,m:stamp(new Date(f.lastModified))}); if(keep) HANDLES.set(prefix+name,h); }
  }
}
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("codo-portal",1); r.onupgradeneeded=()=>r.result.createObjectStore("h"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(){ try{ const db=await idb(); return await new Promise(r=>{ const q=db.transaction("h").objectStore("h").get("root"); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }catch(e){ return null; } }
async function idbSet(h){ try{ const db=await idb(); db.transaction("h","readwrite").objectStore("h").put(h,"root"); }catch(e){} }
async function loadLocal(){
  if(!window.showDirectoryPicker){ toast("Der lokale Ordner lässt sich nur in Edge oder Chrome laden."); return; }
  try{
    let h=await idbGet();
    if(h){ const ok=(await h.queryPermission({mode:"read"}))==="granted"||(await h.requestPermission({mode:"read"}))==="granted"; if(!ok) h=null; }
    if(!h){ toast("Wähle den Projektordner «CoDO Neubau Flims»."); h=await window.showDirectoryPicker({id:"codo-flims",mode:"read"}); }
    let k; try{ k=await (await (await h.getFileHandle("KONTEXT.md")).getFile()).text(); }catch(e){ toast("In diesem Ordner fehlt KONTEXT.md. Wähle den Projektordner «CoDO Neubau Flims»."); return; }
    await idbSet(h);
    const files=[]; HANDLES.clear(); await walk(h,"",files,MODE==="web");
    let ps=""; try{ ps=await (await (await h.getFileHandle("PROJEKTSTRUKTUR.md")).getFile()).text(); }catch(e){}
    store("codo-src","local");
    applyData(files,k,ps,"local"); toast("Aktueller Stand geladen: "+files.filter(f=>!f.d).length+" Dateien.");
  }catch(e){ if(e&&e.name==="AbortError") return; toast("Laden nicht möglich: "+(e&&e.message||e)); }
}

/* ---------- OneDrive über Microsoft Graph ---------- */
let msalApp=null, account=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Anmeldebibliothek konnte nicht geladen werden.")); document.head.appendChild(s); }); }
async function ensureMsal(){
  if(msalApp) return msalApp;
  if(!window.msal) await loadScript(MSAL_URL);
  msalApp=new msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:"https://login.microsoftonline.com/common",redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
  await msalApp.initialize();
  const r=await msalApp.handleRedirectPromise();
  account=(r&&r.account)||msalApp.getActiveAccount()||msalApp.getAllAccounts()[0]||null;
  if(account) msalApp.setActiveAccount(account);
  return msalApp;
}
async function getToken(interactive){
  const app=await ensureMsal();
  if(!account){ if(interactive){ store("codo-src","onedrive"); await app.loginRedirect({scopes:SCOPES,prompt:"select_account"}); } return null; }
  try{ return (await app.acquireTokenSilent({scopes:SCOPES,account})).accessToken; }
  catch(e){ if(interactive){ await app.acquireTokenRedirect({scopes:SCOPES,account}); } return null; }
}
function shareId(u){ return "u!"+btoa(unescape(encodeURIComponent(u))).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-"); }
async function g(t,url){
  const r=await fetch(url.startsWith("http")?url:"https://graph.microsoft.com/v1.0"+url,{headers:{Authorization:"Bearer "+t}});
  if(!r.ok){ const e=new Error("Graph "+r.status); e.status=r.status; try{ e.body=await r.json(); }catch(_){} throw e; }
  return r.json();
}
async function startOneDrive(interactive){
  if(!CFG.clientId||!CFG.shareUrl){ toast("Der Online-Zugang ist noch nicht eingerichtet."); return; }
  try{
    setBusy("Verbinde mit OneDrive …");
    const t=await getToken(interactive);
    if(!t){ render(); return; }
    const root=await g(t,"/shares/"+shareId(CFG.shareUrl)+"/driveItem");
    const driveId=root.parentReference.driveId; const files=[]; let kUrl=null,pUrl=null; let n=0;
    OD_DRIVE=driveId; IS_OWNER=false;
    // Eigentümer erkennen: Konto-ID mit Eigentümer des Laufwerks vergleichen (bei privaten Konten auch mit der Laufwerks-ID)
    const nid=x=>String(x||"").toLowerCase().replace(/[^0-9a-f]/g,"").replace(/^0+/,"").slice(-16);
    let meId=""; try{ meId=nid((await g(t,"/me?$select=id")).id); }catch(e){}
    const cands=[driveId, root.shared&&root.shared.owner&&root.shared.owner.user&&root.shared.owner.user.id];
    try{ const drv=await g(t,`/drives/${driveId}?$select=owner`); cands.push(drv.owner&&drv.owner.user&&drv.owner.user.id); }catch(e){}
    IS_OWNER=!!meId && cands.some(c=>c && nid(c)===meId);
    async function walkG(id,prefix){
      let url=`/drives/${driveId}/items/${id}/children?$top=200`;
      while(url){ const r=await g(t,url);
        for(const it of r.value){
          if(it.folder){ if(it.name==="_Portal"||it.name.startsWith("_to_delete")) continue; files.push({p:prefix+it.name+"/",d:1}); await walkG(it.id,prefix+it.name+"/"); }
          else { if(SKIP.has(it.name)||it.name.startsWith("~$")) continue;
            files.push({p:prefix+it.name,s:it.size,m:stamp(new Date(it.lastModifiedDateTime)),u:it.webUrl,dav:it.webDavUrl||"",id:it.id});
            if(!prefix&&it.name==="KONTEXT.md") kUrl=it["@microsoft.graph.downloadUrl"]; if(!prefix&&it.name==="PROJEKTSTRUKTUR.md") pUrl=it["@microsoft.graph.downloadUrl"]; }
        }
        setBusy(`Lese OneDrive … ${files.filter(f=>!f.d).length} Dateien`);
        url=r["@odata.nextLink"]||null; }
    }
    await walkG(root.id,"");
    const txt=async u=>{ try{ return u? await (await fetch(u)).text() : ""; }catch(e){ return ""; } };
    const [k,ps]=await Promise.all([txt(kUrl),txt(pUrl)]);
    HANDLES.clear(); store("codo-src","onedrive");
    applyData(files,k,ps,"onedrive"); toast("Live aus OneDrive geladen: "+files.filter(f=>!f.d).length+" Dateien.");
  }catch(e){ render(); toast(odError(e)); }
}
function odError(e){
  const code=(e&&(e.errorCode||""))+" "+(e&&e.message||"");
  if(/AADSTS65001|consent|AADSTS90094|admin/i.test(code)) return "Dein Firmenkonto verlangt eine Zustimmung eurer IT. Melde dich mit einem privaten Microsoft-Konto an oder nutze den lokalen Ordner.";
  if(e&&(e.status===403||e.status===404)) return "Mit diesem Konto besteht kein Zugriff auf den Projektordner. Der Ordner muss für dieses Microsoft-Konto freigegeben sein.";
  if(e&&e.status===401) return "Die Anmeldung ist abgelaufen. Bitte erneut anmelden.";
  return "OneDrive-Zugriff nicht möglich: "+(e&&e.message||e);
}
/* ---------- Löschen (nur Eigentümer, nur OneDrive online) ---------- */
let delPath=null;
function askDelete(p){
  const dlg=$("#delDlg"); delPath=p; $("#delName").textContent=p.split("/").pop();
  if(dlg.showModal) dlg.showModal(); else if(confirm("Datei löschen? "+p)) doDelete();
}
$("#delNo").addEventListener("click",()=>{ $("#delDlg").close(); delPath=null; });
$("#delYes").addEventListener("click",()=>{ $("#delDlg").close(); doDelete(); });
async function writeToken(){
  const app=await ensureMsal();
  try{ return (await app.acquireTokenSilent({scopes:WRITE_SCOPES,account})).accessToken; }
  catch(e){ return (await app.acquireTokenPopup({scopes:WRITE_SCOPES,account})).accessToken; }
}
async function doDelete(){
  const p=delPath; delPath=null; const f=D.files.find(x=>x.p===p);
  if(!f||!f.id||!OD_DRIVE||!IS_OWNER){ toast("Löschen ist nur im Modus OneDrive und nur für den Eigentümer möglich."); return; }
  try{
    const t=await writeToken();
    const r=await fetch(`https://graph.microsoft.com/v1.0/drives/${OD_DRIVE}/items/${f.id}`,{method:"DELETE",headers:{Authorization:"Bearer "+t}});
    if(r.status!==204 && !r.ok){ const e=new Error("Graph "+r.status); e.status=r.status; throw e; }
    toast("«"+p.split("/").pop()+"» gelöscht. Sie liegt im Papierkorb von OneDrive.");
    await startOneDrive(false);
  }catch(e){
    if(e&&/popup|user_cancelled|interaction_in_progress/i.test((e.errorCode||"")+" "+(e.message||""))) toast("Löschen abgebrochen: Die Zustimmung zur Schreibberechtigung wurde nicht erteilt.");
    else if(e&&e.status===403) toast("Keine Berechtigung zum Löschen dieser Datei.");
    else toast("Löschen nicht möglich: "+(e&&e.message||e));
  }
}
async function signOut(){ try{ const app=await ensureMsal(); store("codo-src","none"); await app.logoutRedirect({account}); }catch(e){ toast("Abmelden nicht möglich."); } }

drawContours();
current=store("codo-portal-cur")||""; if(current && current!=="__root" && !nodeAt(current)) current="";
if(current && current!=="__root") expandTo(current);
render();
if(MODE==="web" && CFG.clientId && CFG.shareUrl){
  // Rückkehr von der Microsoft-Anmeldung oder gespeicherte Wahl «OneDrive»: still verbinden
  const back=/[#&](code|error)=/.test(location.hash+location.search);
  if(back || store("codo-src")==="onedrive") startOneDrive(false).then(()=>{ if(back) history.replaceState(null,"",location.pathname); });
}
